<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SEE Protector</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <div class="header">
        <h2 class="glow-text">SEE Protector</h2>
        <div class="status-badge">
            <span class="dot active"></span> Sistem Aktif
        </div>
    </div>
    
    <div class="content">
        <p class="description">SEE Protector aktif melindungi peramban Anda dari ancaman eksfiltrasi ekstensi jahat secara <b>real-time</b>.</p>
        
        <div class="history-section">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 8px;">
                <h3 style="font-size: 0.95rem; color:#f8fafc;">Riwayat Analisis</h3>
                <button id="btn-clear-history" class="btn-text">Bersihkan</button>
            </div>
            
            <div id="history-list" class="history-list">
                <!-- Data riwayat akan dirender di sini via popup.js -->
                <p style="font-size:0.8rem; color:#64748b; text-align:center; margin-top:20px;">Belum ada riwayat analisis.</p>
            </div>
        </div>

        <div class="settings-section" style="margin-top: 15px; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 10px;">
            <label style="font-size: 0.8rem; color:#94a3b8; display:flex; justify-content:space-between; align-items:center;">
                Server API:
                <select id="server-select" style="background:#1e293b; color:#f8fafc; border:1px solid #334155; border-radius:4px; padding:3px 5px; font-family:'Outfit', sans-serif;">
                    <option value="http://127.0.0.1:5002">Host (Port 5002)</option>
                    <option value="http://127.0.0.1:5003">VM (Port 5003)</option>
                </select>
            </label>
        </div>
    </div>
    <script src="popup.js"></script>
</body>
</html>
