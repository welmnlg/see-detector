<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body {
      width: 220px;
      padding: 16px;
      font-family: -apple-system, sans-serif;
      background: #1a1a2e;
      color: #fff;
      margin: 0;
    }
    h3 {
      margin: 0 0 12px;
      font-size: 14px;
      color: #a78bfa;
    }
    .toggle-btn {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
      margin-bottom: 10px;
    }
    .toggle-btn.on {
      background: #7c3aed;
      color: white;
    }
    .toggle-btn.off {
      background: #374151;
      color: #9ca3af;
    }
    .status {
      font-size: 12px;
      color: #6b7280;
      text-align: center;
      margin-bottom: 12px;
    }
    .status.active {
      color: #10b981;
    }
    label {
      font-size: 12px;
      color: #9ca3af;
      display: block;
      margin-bottom: 4px;
    }
    select, input[type=range] {
      width: 100%;
      background: #374151;
      border: 1px solid #4b5563;
      color: #fff;
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    .interval-val {
      font-size: 11px;
      color: #a78bfa;
      text-align: right;
      margin-top: -8px;
      margin-bottom: 10px;
    }
    .mode-row {
      display: flex;
      gap: 6px;
      margin-bottom: 10px;
    }
    .mode-btn {
      flex: 1;
      padding: 6px 4px;
      border: 1px solid #4b5563;
      border-radius: 6px;
      background: #374151;
      color: #9ca3af;
      font-size: 11px;
      cursor: pointer;
      text-align: center;
    }
    .mode-btn.selected {
      border-color: #7c3aed;
      background: #4c1d95;
      color: #c4b5fd;
    }
    .footer {
      font-size: 10px;
      color: #4b5563;
      text-align: center;
      margin-top: 8px;
    }
  </style>
</head>
<body>
  <h3>🖱️ Stay Active</h3>
  
  <button class="toggle-btn off" id="toggleBtn">Start</button>
  <div class="status" id="status">
    <span id="pulseDot" style="display:inline-block;width:8px;height:8px;border-radius:50%;background:#10b981;margin-right:6px;opacity:0;transition:opacity 0.3s;"></span>
    <span id="statusText">Inactive</span>
  </div>

  <label>Mode</label>
  <div class="mode-row">
    <div class="mode-btn" id="modeMove" data-mode="move">Mouse Move</div>
    <div class="mode-btn selected" id="modeScroll" data-mode="scroll">Scroll</div>
  </div>
  <div id="modeDesc" style="font-size:11px;color:#6b7280;margin-bottom:10px;line-height:1.4;"></div>

  <label>Interval</label>
  <input type="range" id="intervalSlider" min="10" max="300" value="60">
  <div class="interval-val" id="intervalVal">Every 60 seconds</div>

  <div class="footer">Works on Slack, Teams, Zoom, any webpage</div>

  <script src="popup.js"></script>
</body>
</html>
