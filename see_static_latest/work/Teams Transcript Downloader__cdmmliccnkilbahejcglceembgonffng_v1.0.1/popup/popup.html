<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Teams Transcript Downloader</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <header>
    <div class="header-content">
      <div class="header-icon">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
          <polyline points="14 2 14 8 20 8"></polyline>
          <line x1="16" y1="13" x2="8" y2="13"></line>
          <line x1="16" y1="17" x2="8" y2="17"></line>
          <polyline points="10 9 9 9 8 9"></polyline>
        </svg>
      </div>
      <div class="header-text">
        <h1>Teams Transcript Downloader</h1>
        <span class="header-subtitle">Meeting Stream</span>
      </div>
    </div>
  </header>

  <main>
    <!-- Status / Empty state -->
    <div id="status" class="status-card" hidden>
      <div class="status-icon" id="status-icon"></div>
      <p class="status-text" id="status-text"></p>
    </div>

    <!-- Current page transcripts -->
    <section id="transcripts-section" hidden>
      <div class="section-label">
        <span class="section-dot section-dot-active"></span>
        Current Page
      </div>
      <ul id="transcript-list" class="card-list"></ul>
    </section>

    <!-- Download history -->
    <section id="history-section" class="history-section" hidden>
      <div class="section-label">
        <span class="section-dot section-dot-history"></span>
        History
        <button id="clear-history" class="btn-icon" title="Clear history">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"></polyline>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path>
          </svg>
        </button>
      </div>
      <ul id="history-list" class="card-list card-list-history"></ul>
    </section>
  </main>

  <footer>
    <span>Active on Meeting Stream pages only</span>
  </footer>

  <script src="popup.js"></script>
</body>
</html>
