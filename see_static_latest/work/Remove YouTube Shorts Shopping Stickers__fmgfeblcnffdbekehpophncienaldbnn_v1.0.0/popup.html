<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0f0f0f;
      --surface: #1a1a1a;
      --border: #2a2a2a;
      --text: #f0f0f0;
      --muted: #888;
      --accent: #ff3c3c;
      --accent-dim: rgba(255, 60, 60, 0.15);
      --on: #3ecf6e;
      --on-dim: rgba(62, 207, 110, 0.15);
    }

    body {
      width: 260px;
      background: var(--bg);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 13px;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      width: 28px;
      height: 28px;
      border-radius: 7px;
      flex-shrink: 0;
      overflow: hidden;
    }

    .logo img { width: 100%; height: 100%; display: block; }

    .title {
      font-size: 13px;
      font-weight: 600;
      color: var(--text);
      line-height: 1.2;
    }

    .subtitle {
      font-size: 11px;
      color: var(--muted);
      margin-top: 1px;
    }

    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px 14px;
      transition: border-color 0.2s;
    }

    .toggle-row.active {
      border-color: var(--on);
      background: var(--on-dim);
    }

    .toggle-label {
      font-size: 12px;
      font-weight: 500;
      color: var(--text);
    }

    .status-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--muted);
      display: inline-block;
      margin-right: 6px;
      transition: background 0.2s;
    }

    .active .status-dot { background: var(--on); }

    .switch {
      position: relative;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider {
      position: absolute;
      inset: 0;
      background: #333;
      border-radius: 20px;
      cursor: pointer;
      transition: background 0.2s;
    }

    .slider::before {
      content: '';
      position: absolute;
      width: 14px;
      height: 14px;
      left: 3px;
      top: 3px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    input:checked + .slider { background: var(--on); }
    input:checked + .slider::before { transform: translateX(16px); }

    .footer {
      margin-top: 14px;
      font-size: 10px;
      color: var(--muted);
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="logo">
      <img src="icons/icon48.png" alt="">
    </div>
    <div>
      <div class="title" id="ext-name"></div>
      <div class="subtitle">YouTube Shorts</div>
    </div>
  </div>

  <div class="toggle-row" id="toggle-row">
    <div class="toggle-label">
      <span class="status-dot"></span>
      <span id="toggle-label-text"></span>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle">
      <span class="slider"></span>
    </label>
  </div>

  <div class="footer" id="footer-text"></div>

  <script src="popup.js"></script>
</body>
</html>
