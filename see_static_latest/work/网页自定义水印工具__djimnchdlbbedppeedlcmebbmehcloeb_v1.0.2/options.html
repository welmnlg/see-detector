<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>水印工具 - 设置</title>
    <link rel="stylesheet" href="options.css" />
  </head>
  <body>
    <div class="app-container">
      <!-- 左侧：侧边栏 -->
      <aside class="sidebar">
        <div class="sidebar-header">
          <div class="brand">
            <div class="logo">W</div>
            <span>水印配置</span>
          </div>
          <button id="add-config-btn" class="icon-btn" title="添加新配置">
            <svg
              viewBox="0 0 24 24"
              width="20"
              height="20"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
            >
              <path d="M12 5v14M5 12h14" />
            </svg>
          </button>
        </div>
        <ul id="config-list" class="config-list"></ul>
      </aside>

      <!-- 右侧：内容区 -->
      <main class="main-content">
        <div id="editor-view" class="editor-container">
          <header class="content-header">
            <div class="title-section">
              <h1 id="edit-title">编辑配置</h1>
              <p class="subtitle">设置该域名下水印的显示效果</p>
            </div>
            <div class="header-actions">
              <!-- 建议包裹一层以方便布局 -->
              <button id="copy-config-btn" class="btn btn-outline-primary">
                <svg
                  viewBox="0 0 24 24"
                  width="16"
                  height="16"
                  fill="none"
                  stroke="currentColor"
                  stroke-width="2"
                  style="margin-right: 4px"
                >
                  <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                  <path
                    d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"
                  ></path>
                </svg>
                复制一份
              </button>
              <button id="delete-config-btn" class="btn btn-outline-danger">
                删除
              </button>
            </div>
          </header>

          <div class="config-card">
            <!-- 基础设置 -->
            <section class="config-section">
              <div class="form-grid">
                <div class="form-group full-width">
                  <label>配置名称</label>
                  <input
                    type="text"
                    id="config-name"
                    placeholder="例如：公司内网"
                  />
                </div>

                <div class="form-group full-width">
                  <div class="label-row">
                    <label>生效域名</label>
                    <!-- <span class="badge">每行一个</span> -->
                  </div>
                  <textarea
                    id="domains"
                    rows="5"
                    placeholder="example.com"
                  ></textarea>
                  <p class="input-hint">匹配域名关键词即生效，多个请换行</p>
                </div>
              </div>
            </section>

            <!-- 视觉样式 -->
            <section class="config-section">
              <!-- <div class="section-title">视觉样式</div> -->
              <div class="form-grid">
                <div class="form-group">
                  <label>水印内容</label>
                  <input type="text" id="text" placeholder="内部资料" />
                </div>

                <div class="form-group">
                  <label>颜色</label>
                  <div class="color-input-wrapper">
                    <input type="color" id="color" />
                    <code id="color-hex">#000000</code>
                  </div>
                </div>

                <div class="form-group">
                  <div class="label-row">
                    <label>字体大小</label>
                    <span class="value-tag"
                      ><span id="fontsize-val">20</span>px</span
                    >
                  </div>
                  <input type="range" id="fontsize" min="10" max="80" />
                </div>

                <div class="form-group">
                  <div class="label-row">
                    <label>不透明度</label>
                    <span class="value-tag" id="opacity-val">0.15</span>
                  </div>
                  <input
                    type="range"
                    id="opacity"
                    min="0.05"
                    max="1"
                    step="0.05"
                  />
                </div>

                <div class="form-group">
                  <div class="label-row">
                    <label>间距密度（数字越大越稀疏）</label>
                    <span class="value-tag" id="density-val">300</span>
                  </div>
                  <input
                    type="range"
                    id="density"
                    min="150"
                    max="600"
                    step="10"
                  />
                </div>

                <div class="form-group flex-row">
                  <label>启用当前配置</label>
                  <label class="switch">
                    <input type="checkbox" id="enabled" />
                    <span class="slider round"></span>
                  </label>
                </div>
              </div>
            </section>
          </div>

          <div class="footer-actions">
            <button id="save-btn" class="btn btn-primary">保存所有更改</button>
            <div id="status" class="status-msg"></div>
          </div>
        </div>

        <div id="empty-state" class="empty-state" style="display: none">
          <div class="empty-icon">🎨</div>
          <h3>暂无配置</h3>
          <p>点击左侧按钮创建你的第一个水印配置</p>
        </div>
      </main>
    </div>

    <!-- Toast 通知 -->
    <div id="toast" class="toast">保存成功</div>

    <script src="options.js"></script>
  </body>
</html>
