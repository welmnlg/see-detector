<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Allow Paste</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <main class="panel">
      <p class="eyebrow">Allow Paste</p>
      <h1>Cut, copy, and paste</h1>
      <p class="description" id="site-label">Checking current tab...</p>

      <label class="toggle" for="site-toggle">
        <span>Enabled on this site</span>
        <input id="site-toggle" type="checkbox" />
        <span class="track" aria-hidden="true"></span>
      </label>

      <p class="hint" id="hint-text">
        This extension intercepts the event handlers sites use to block
        clipboard actions.
      </p>
    </main>

    <script src="popup.js"></script>
  </body>
</html>
