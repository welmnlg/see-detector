<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hinglish Translator</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <header>
      <div class="logo">हि</div>
      <h1>Hinglish Translator</h1>
      <p class="subtitle">Translate any webpage into Hinglish</p>
    </header>

    <div class="api-section">
      <label for="apiKey">Gemini API Key</label>
      <div class="input-row">
        <input
          type="password"
          id="apiKey"
          placeholder="Enter your Gemini API key"
          autocomplete="off"
        />
        <button id="toggleKey" class="icon-btn" title="Show/Hide key">👁</button>
      </div>
      <button id="saveKey" class="btn btn-secondary">Save Key</button>
      <div id="keyStatus" class="status hidden"></div>
    </div>

    <div class="model-section">
      <label for="modelSelect">Gemini Model</label>
      <select id="modelSelect">
        <optgroup label="⚡ Latest (2.5)">
          <option value="gemini-2.5-flash">Gemini 2.5 Flash — Fast & smart</option>
          <option value="gemini-2.5-pro">Gemini 2.5 Pro — Most capable</option>
        </optgroup>
        <optgroup label="🚀 Stable (2.0)">
          <option value="gemini-2.0-flash" selected>Gemini 2.0 Flash — Balanced</option>
          <option value="gemini-2.0-flash-lite">Gemini 2.0 Flash Lite — Fastest</option>
        </optgroup>
        <optgroup label="📦 Legacy (1.5)">
          <option value="gemini-1.5-pro">Gemini 1.5 Pro — High quality</option>
          <option value="gemini-1.5-flash">Gemini 1.5 Flash — Quick</option>
          <option value="gemini-1.5-flash-8b">Gemini 1.5 Flash 8B — Lightweight</option>
        </optgroup>
      </select>
      <p class="model-hint" id="modelHint">Good balance of speed and quality</p>
    </div>

    <div class="divider"></div>

    <div class="actions">
      <button id="translateBtn" class="btn btn-primary">
        <span class="btn-icon">🔄</span>
        Translate to Hinglish
      </button>
      <button id="restoreBtn" class="btn btn-outline">
        <span class="btn-icon">↩️</span>
        Restore Original
      </button>
    </div>

    <div id="progress" class="progress-section hidden">
      <div class="progress-bar">
        <div class="progress-fill" id="progressFill"></div>
      </div>
      <p id="progressText" class="progress-text">Translating...</p>
    </div>

    <footer>
      <p>Powered by Google Gemini AI</p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
