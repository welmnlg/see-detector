<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Microsoft to Microslop Extension</title>
<style>
/* Overall popup size */
body {
    margin: 0;
    width: 260px;
    font-family: Tahoma, Verdana, sans-serif;
    background: #ece9d8;
    color: #000;
}
/* Window frame */
.window {
    border: 2px solid #003c74;
    box-shadow: inset 0 0 0 1px #fff;
}
/* Title bar (Windows XP style) */
.title-bar {
    background: linear-gradient(to bottom, #0a246a, #3a6ea5);
    color: #fff;
    padding: 4px 8px;
    font-size: 12px;
    font-weight: bold;
    display: flex;
    align-items: center;
}
/* Content area */
.content {
    padding: 12px;
}
/* Status box */
.status {
    background: #fff;
    border: 1px solid #7f9db9;
    padding: 6px;
    margin-bottom: 10px;
    font-size: 12px;
}
.status span {
    font-weight: bold;
}
/* Buttons container */
.buttons {
    display: flex;
    justify-content: space-between;
}
/* XP-style button */
button {
    font-family: Tahoma, Verdana, sans-serif;
    font-size: 12px;
    padding: 4px 14px;
    background: linear-gradient(to bottom, #ffffff, #dcdcdc);
    border: 1px solid #7f9db9;
    box-shadow:
        inset 1px 1px 0 #fff,
        inset -1px -1px 0 #a0a0a0;
    cursor: pointer;
}
button:active {
    background: linear-gradient(to bottom, #dcdcdc, #ffffff);
    box-shadow:
        inset 1px 1px 0 #a0a0a0,
        inset -1px -1px 0 #fff;
}
button:disabled {
    color: #808080;
    cursor: default;
    opacity: 0.6;
}
</style>
</head>
<body>
<div class="window">
    <div class="title-bar">
        <span>Microsoft to Microslop Extension</span>
    </div>
    <div class="content">
        <div class="status">
            Status: <span id="statusText">Active</span>
        </div>
        <div class="buttons">
            <button id="pauseBtn">Pause</button>
            <button id="resumeBtn">Resume</button>
        </div>
    </div>
</div>
<script src="popup.js"></script>
</body>
</html>
