<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Image Translator OCR</title>
  <link rel="stylesheet" href="popup.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
</head>

<body>
  <div class="container">
    <header class="popup-header">
      <h1>Image Translator</h1>
    </header>

    <main class="popup-main">
      <section class="section-action">
        <button id="capture-btn" class="primary-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3 3H9V5H5V9H3V3Z" fill="currentColor" />
            <path d="M3 21H9V19H5V15H3V21Z" fill="currentColor" />
            <path d="M21 21H15V19H19V15H21V21Z" fill="currentColor" />
            <path d="M21 3H15V5H19V9H21V3Z" fill="currentColor" />
          </svg>
          <span>Capture & Translate</span>
          <span class="shortcut-hint">Alt + R</span>
        </button>
      </section>

      <section class="settings-container">
        <div class="divider"><span>Settings</span></div>

        <div class="form-row form-row-equal">
          <div class="form-group form-group-half">
            <label for="provider">Provider</label>
            <select id="provider">
              <option value="gemini">Gemini</option>
              <option value="openai">OpenAI</option>
            </select>
          </div>
          <div class="form-group form-group-half">
            <label for="model-name">Model</label>
            <input type="text" id="model-name" placeholder="gemini-2.0-flash or gpt-4o">
          </div>
        </div>

        <div class="form-group">
          <label for="target-lang">Target Language</label>
          <select id="target-lang">
            <option value="Vietnamese">Vietnamese</option>
            <option value="English">English</option>
            <option value="Chinese">Chinese</option>
            <option value="Japanese">Japanese</option>
            <option value="Korean">Korean</option>
            <option value="Thai">Thai</option>
            <option value="Indonesian">Indonesian</option>
            <option value="French">French</option>
            <option value="German">German</option>
            <option value="Spanish">Spanish</option>
            <option value="Italian">Italian</option>
            <option value="Portuguese">Portuguese</option>
            <option value="Russian">Russian</option>
            <option value="Arabic">Arabic</option>
            <option value="Turkish">Turkish</option>
            <option value="Dutch">Dutch</option>
            <option value="Polish">Polish</option>
            <option value="Hindi">Hindi</option>
            <option value="Auto">Auto (Detect)</option>
          </select>
        </div>

        <div class="form-group">
          <label for="api-key">API Key</label>
          <input type="password" id="api-key" placeholder="Paste your API Key here">
        </div>

        <button id="save-btn" class="secondary-btn">Save Configuration</button>
      </section>

      <div id="status-message" class="status hidden"></div>

      <footer class="contact-footer">
        <a href="mailto:jaxlol2206@gmail.com" class="contact-link" title="Email">jaxlol2206@gmail.com</a>
        <a href="https://t.me/Zoro2206a" target="_blank" rel="noopener" class="contact-telegram" title="Telegram @Zoro2206a" aria-label="Telegram">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
            <path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/>
          </svg>
        </a>
      </footer>
    </main>
  </div>
  <script src="popup.js"></script>
</body>

</html>
