<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VK Ads Pixel Detector</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">

    <!-- Header -->
    <div class="header">
      <div class="header-logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none">
          <circle cx="12" cy="12" r="10" fill="currentColor" opacity="0.15"/>
          <path d="M8 12l3 3 5-5" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
      </div>
      <div class="header-title">
        <span class="title-main">VK Реклама (Ads)</span>
        <span class="title-sub">Поиск пикселей</span>
      </div>
    </div>
    <div class="author">
      Павел Баракаев — <a href="https://barakaev.ru/?utm_source=chrome_extension&utm_medium=browser&utm_campaign=vkads" target="_blank">www.barakaev.ru</a>
    </div>

    <!-- Status Card -->
    <div class="status-card" id="statusCard">
      <div class="status-indicator" id="statusIndicator">
        <div class="status-dot" id="statusDot"></div>
        <span class="status-text" id="statusText">Сканирование...</span>
      </div>
      <div class="status-url" id="statusUrl"></div>
    </div>

    <!-- Pixel IDs -->
    <div class="section" id="pixelSection" style="display:none;">
      <div class="section-header">
        <span class="section-title">Найденные пиксели</span>
        <span class="badge" id="pixelCount">0</span>
      </div>
      <div class="pixel-list" id="pixelList"></div>
    </div>

    <!-- Detection Details -->
    <div class="section" id="detailsSection" style="display:none;">
      <div class="section-header">
        <span class="section-title">Детали обнаружения</span>
        <button class="toggle-btn" id="toggleDetails">▼</button>
      </div>
      <div class="details-content" id="detailsContent" style="display:none;">
        <div id="detailsList"></div>
      </div>
    </div>

    <!-- Actions -->
    <div class="actions">
      <button class="btn btn-primary" id="btnScan">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M1 4v6h6M23 20v-6h-6"/>
          <path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
        </svg>
        Проверить страницу
      </button>
      <button class="btn btn-secondary" id="btnExport" style="display:none;">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        Экспорт CSV
      </button>
    </div>

    <!-- History -->
    <div class="section" id="historySection">
      <div class="section-header">
        <span class="section-title">История проверок</span>
        <button class="clear-btn" id="btnClearHistory">Очистить</button>
      </div>
      <div id="historyList">
        <div class="empty-state">История пуста</div>
      </div>
    </div>

    <div class="privacy-note">История URL сохраняется локально в браузере и не передаётся третьим лицам.</div>
    <div class="footer">
      VK Реклама Pixel Detector v1.2.1
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
