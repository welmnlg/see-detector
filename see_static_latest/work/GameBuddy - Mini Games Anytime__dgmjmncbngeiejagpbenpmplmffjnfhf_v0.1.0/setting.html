<!doctype html>
<html>
<head>
  <link href="css/setting.css" rel="stylesheet">
  <script type="module" src="js/setting.js"></script>
</head>
<body>
  <div id="body">
    <div id="overlay">
      <div class="label">
        Settings
      </div>
      <div class="card" >
        <label for="switchBtn" id="control">
          <input type="checkbox" id="switchBtn" checked/>
          <span class="switch"></span>
          <span class="toggle"></span>
        </label>
      </div>
    </div>
    <div id="msg">
      <p class="status">Once enabled, game buddy appears in the bottom-right corner. Click it to play games!</p>
    </div>
  </div>
</body>
</html>
