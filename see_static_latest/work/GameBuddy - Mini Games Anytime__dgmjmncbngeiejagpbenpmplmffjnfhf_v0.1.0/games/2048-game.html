<link rel="stylesheet" type="text/css" href="/releases/css/2048-game.css"/>
    <div id="gamebox">
        <div class="header">
            <div class="refresh">
                <span id= "init_game">New <br />Game</span>
            </div>          
            <div class="score">
                <div class="best">
                    <label>BEST</label><br>
                    <span id="bestScore">0</span>
                </div> 
                <div class="current">
                    <label>SCORE</label><br>
                    <span id="score">0</span>
                </div>
                <div id="addScore">+2</div>             
            </div>
        </div>
        <div id="gm-content">
            <div class="s-border" id="blockage-0-0"></div>
            <div class="s-border" id="blockage-0-1"></div>
            <div class="s-border" id="blockage-0-2"></div>
            <div class="s-border" id="blockage-0-3"></div>
            <div class="s-border" id="blockage-1-0"></div>
            <div class="s-border" id="blockage-1-1"></div>
            <div class="s-border" id="blockage-1-2"></div>
            <div class="s-border" id="blockage-1-3"></div>

            <div class="s-border" id="blockage-2-0"></div>
            <div class="s-border" id="blockage-2-1"></div>
            <div class="s-border" id="blockage-2-2"></div>
            <div class="s-border" id="blockage-2-3"></div>

            <div class="s-border" id="blockage-3-0"></div>
            <div class="s-border" id="blockage-3-1"></div>
            <div class="s-border" id="blockage-3-2"></div>
            <div class="s-border" id="blockage-3-3"></div>
        </div>
        <div id="mask">
            <div id="gameoverwrapper">
                <p id="gameovertext">Game over!</p>
                <span id= "restart_game">Try again</span>
            </div>
        </div>
    </div>
<script src="/releases/js/2048-game.js"></script>
