<link rel="stylesheet" type="text/css" href="/releases/css/word-scramble.css"/>
    <div id="gamebox">
        <div id="header">
            <div id="score">Score: <span id="scorev">0</span></div>
            <div id="answer"></div>
            <div id="time">Remain: <span id="timer">60s</span></div>
        </div>
        <div id="game-container">
            <div id="grid-container"></div>
            <input type="text" id="word-input" placeholder="Your answer">
            <button id="submit-button">Submit</button>
            <button id="next-button">Next</button>
            <button id="view-button">View</button>
        </div>
        <div id="gameover" class="gameover">
            <p class="msg">Game Over!</p>
            <a id="tryagainbtn">Try Again</a>
            <a id="nextlevelbtn">Next Level</a>
            <a id="resetbtn">Reset</a>
        </div>
    </div>
<script src="/releases/js/word-scramble.js"></script>
