<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title id="i18n-title">一键读图（OCR）</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup">
    <header class="popup-header">
      <div class="popup-header-text">
        <h1 class="popup-title" data-i18n="popupTitle">一键读图（OCR）</h1>
        <p class="popup-tagline" data-i18n="popupTagline">框选网页区域，在当前页识别文字</p>
      </div>
    </header>

    <main class="popup-main">
      <button type="button" class="card card--primary" id="screenshotBtn" data-command="screenshot" aria-describedby="statusMessage">
        <span class="card-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><rect x="6" y="6" width="12" height="12" rx="1" stroke-dasharray="3 2"/></svg>
        </span>
        <span class="card-content">
          <span class="card-title" data-i18n="popupScreenshot">截图选择</span>
          <span class="card-desc" data-i18n="popupScreenshotDesc">拖动框选区域，自动 OCR 并可在页面内复制结果</span>
        </span>
        <span class="card-shortcut" id="shortcut-screenshot" aria-hidden="true"></span>
      </button>
    </main>

    <div class="popup-status" id="statusMessage" role="status" aria-live="polite"></div>

    <footer class="popup-footer">
      <span class="popup-footer-info" data-i18n="popupFooterInfo">截图选区 · 页面内识别 · 本地 OCR</span>
      <button type="button" class="popup-settings" id="settingsShortcutBtn" data-i18n-title="popupSettingsShortcut" title="设置快捷方式" aria-label="设置快捷方式">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </button>
    </footer>
  </div>
  <script src="popup.js"></script>
</body>
</html>
