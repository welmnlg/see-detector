<!DOCTYPE html>
<html>
<head>
  <title>リンクキャプチャ</title>
  <meta charset="UTF-8">
  <style>
    :root {
      --background-color: #f7f8fa;
      --text-color: #1f2328;
      --header-bg: #ffffff;
      --textarea-bg: #ffffff;
      --textarea-border: #d0d7de;
      --button-bg: #2c974b;
      --button-text: #ffffff;
      --button-hover-bg: #278541;
      --danger-button-bg: #d73a49;
      --danger-button-hover-bg: #b92534;
      --border-color: #d0d7de;
      --link-color: #0969da;
      --font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background-color: #0d1117;
        --text-color: #e6edf3;
        --header-bg: #161b22;
        --textarea-bg: #010409;
        --textarea-border: #30363d;
        --button-bg: #238636;
        --button-hover-bg: #2ea043;
        --danger-button-bg: #da3633;
        --danger-button-hover-bg: #f85149;
        --border-color: #30363d;
        --link-color: #58a6ff;
      }
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      font-family: var(--font-family);
      background-color: var(--background-color);
      color: var(--text-color);
    }

    .container {
      display: flex;
      flex-direction: column;
      height: 100vh;
    }

    .header {
      padding: 12px 16px;
      background-color: var(--header-bg);
      border-bottom: 1px solid var(--border-color);
      position: relative;
      flex-shrink: 0; /* ヘッダーは縮まない */
    }
    .title { margin: 0; font-size: 16px; font-weight: 600; }
    
    .limit-message { 
      color: var(--danger-button-bg); 
      font-size: 12px;
      font-weight: bold;
      position: absolute;
      right: 16px;
      top: 50%;
      transform: translateY(-50%);
    }

    .main-content {
      flex-grow: 1; /* 残りのスペースを埋める */
      padding: 8px;
      display: flex;
    }

    textarea {
      flex-grow: 1; width: 100%; box-sizing: border-box; border: 1px solid var(--textarea-border);
      background-color: var(--textarea-bg); color: var(--text-color); padding: 8px;
      font-family: monospace; font-size: 14px; resize: none; border-radius: 6px;
    }
    textarea:focus { outline: 2px solid var(--button-bg); border-color: transparent; }
    textarea::placeholder { color: #6a737d; }

    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      border-top: 1px solid var(--border-color);
      background-color: var(--header-bg);
      flex-shrink: 0; /* フッターは縮まない */
    }
    .footer-actions { display: flex; gap: 8px; }

    .settings-area { font-size: 12px; }
    #license-form { display: flex; align-items: center; gap: 8px; }
    #license-input { 
      padding: 5px 8px; 
      border-radius: 6px; 
      border: 1px solid var(--textarea-border);
      background-color: var(--textarea-bg);
      color: var(--text-color);
    }
    .settings-area a { color: var(--link-color); text-decoration: none; }
    .settings-area a:hover { text-decoration: underline; }
    #activated-message p { margin: 0; font-weight: bold; color: var(--button-bg); }

    .button {
      padding: 5px 12px; font-size: 13px; font-weight: 500; border-radius: 6px;
      border: 1px solid var(--button-bg); cursor: pointer; background-color: var(--button-bg);
      color: var(--button-text); transition: background-color 0.2s ease-in-out;
    }
    .button:hover { background-color: var(--button-hover-bg); }
    .button-danger { background-color: var(--danger-button-bg); border-color: var(--danger-button-bg); }
    .button-danger:hover { background-color: var(--danger-button-hover-bg); }
    
    .footer-note {
      padding: 4px 16px;
      background-color: var(--header-bg);
      border-top: 1px solid var(--border-color);
      text-align: center;
      flex-shrink: 0; /* 注意書きは縮まない */
    }
    .footer-note p { margin: 0; font-size: 11px; color: #6a737d; }

    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div class="container">
    <header class="header">
      <h1 class="title">リンクキャプチャ</h1>
      <div id="limit-message" class="limit-message hidden">リンク上限3つ</div>
    </header>
    <main class="main-content">
      <textarea id="links-textarea" readonly placeholder="WebページでリンクをクリックするとここにURLが追加されます..."></textarea>
    </main>
    <footer class="footer">
      <div class="settings-area">
        <div id="license-form">
          <input type="text" id="license-input" placeholder="ライセンスキー">
          <button id="activate-button" class="button">認証</button>
          <a href="https://note.com/takane_konbu/n/n4fe5d315490b" target="_blank">キーを取得</a>
        </div>
        <div id="activated-message" class="hidden">
          <p>プレミアム版認証済み</p>
        </div>
      </div>
      <div class="footer-actions">
        <button id="copy-button" class="button">すべてコピー</button>
        <button id="clear-button" class="button button-danger">クリア</button>
      </div>
    </footer>
    <div class="footer-note">
      <p>リンクが取得できない場合は、Webページを再読み込みしてください。</p>
    </div>
  </div>
  <script src="sidepanel.js"></script>
</body>
</html>
