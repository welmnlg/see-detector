<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NetReplay</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 280px;
      background: #0f172a;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 18px 14px;
      border-bottom: 1px solid #1e293b;
      background: #1e293b;
    }
    .icon {
      width: 34px; height: 34px; border-radius: 50%; flex-shrink: 0;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 8px rgba(99,102,241,.45);
    }
    .icon svg { width: 18px; height: 18px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .brand h1 { font-size: 14px; font-weight: 700; color: #a78bfa; letter-spacing: .2px; }
    .brand p  { font-size: 11px; color: #475569; margin-top: 1px; }

    /* ── Toggle row ── */
    .toggle-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 18px 14px;
    }
    .toggle-label { display: flex; flex-direction: column; gap: 2px; }
    .toggle-label strong { font-size: 13px; font-weight: 600; color: #e2e8f0; }
    .toggle-label span   { font-size: 11px; color: #64748b; }

    /* Toggle switch */
    .switch { position: relative; display: inline-block; width: 44px; height: 24px; flex-shrink: 0; }
    .switch input { opacity: 0; width: 0; height: 0; }
    .slider {
      position: absolute; inset: 0; cursor: pointer;
      background: #334155; border-radius: 24px;
      transition: background .2s;
    }
    .slider::before {
      content: ''; position: absolute;
      width: 18px; height: 18px; border-radius: 50%;
      left: 3px; bottom: 3px;
      background: #94a3b8;
      transition: transform .2s, background .2s;
      box-shadow: 0 1px 3px rgba(0,0,0,.4);
    }
    input:checked + .slider { background: #6366f1; }
    input:checked + .slider::before { transform: translateX(20px); background: #fff; }

    /* ── Status badge ── */
    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      margin: 0 18px 18px;
      padding: 8px 12px;
      border-radius: 8px;
      background: #1e293b;
      border: 1px solid #334155;
      transition: background .2s, border-color .2s;
    }
    .status-bar.active  { background: #0d2218; border-color: #166534; }
    .status-bar.inactive{ background: #1e1e2e; border-color: #334155; }

    .dot {
      width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0;
      background: #334155; transition: background .2s;
    }
    .dot.active   { background: #4ade80; box-shadow: 0 0 6px rgba(74,222,128,.5); animation: pulse 2s infinite; }
    .dot.inactive { background: #475569; }
    @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.5} }

    .status-text { font-size: 12px; font-weight: 500; }
    .status-text.active   { color: #4ade80; }
    .status-text.inactive { color: #475569; }

    /* ── Hint ── */
    .hint {
      display: none;
      margin: 0 18px 16px;
      font-size: 11px;
      color: #64748b;
      line-height: 1.5;
    }
    .hint.show { display: block; }
    .hint strong { color: #94a3b8; }

    /* ── Footer ── */
    .footer {
      padding: 10px 18px;
      border-top: 1px solid #1e293b;
      text-align: center;
    }
    .footer p  { font-size: 10px; color: #334155; line-height: 1.6; }
    .footer a  { color: #4f46e5; text-decoration: none; }
    .footer a:hover { color: #a78bfa; }
  </style>
</head>
<body>
  <div class="header">
    <div class="icon">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M2 12h3M19 12h3M12 2v3M12 19v3"/><path d="M4.9 4.9l2.1 2.1M16.9 16.9l2.1 2.1M4.9 19.1l2.1-2.1M16.9 7.1l2.1-2.1"/></svg>
    </div>
    <div class="brand">
      <h1>NetReplay</h1>
      <p>Capture &amp; Replay Network Requests</p>
    </div>
  </div>

  <div class="toggle-row">
    <div class="toggle-label">
      <strong>Capture requests</strong>
      <span>Show panel on all pages</span>
    </div>
    <label class="switch">
      <input type="checkbox" id="toggle" checked>
      <span class="slider"></span>
    </label>
  </div>

  <div class="status-bar active" id="status-bar">
    <div class="dot active" id="dot"></div>
    <span class="status-text active" id="status-text">Capturing on this tab</span>
  </div>

  <p class="hint" id="hint">
    <strong>Reload the tab</strong> to fully apply the change.
  </p>

  <div class="footer">
    <p>
      Developed by <a href="https://www.linkedin.com/in/russelsese/" target="_blank">Russel Sese</a>
      &nbsp;·&nbsp;
      <a href="mailto:russel.sese@batchee.com">russel.sese@batchee.com</a>
    </p>
  </div>

  <script src="popup.js"></script>
</body>
</html>
